site_name: Project GMAO Documentation
site_description: Comprehensive documentation for the GMAO (Gestion de Maintenance Assistée par Ordinateur) system
site_author: Your Team
site_url: https://project-gmao.readthedocs.io

repo_name: project-gmao
repo_url: https://github.com/yourusername/project-gmao
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [apps/api]

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: getting-started/quick-start.md
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
  - Architecture:
      - Overview: architecture/overview.md
      - Database Schema: architecture/database.md
      - RAG Pipeline: architecture/rag-pipeline.md
      - IoT Streaming: architecture/iot-streaming.md
  - Features:
      - Dashboard: features/dashboard.md
      - Maintenance Planning: features/maintenance-planning.md
      - Chatbot: features/chatbot.md
      - Data Management: features/data-management.md
      - IoT Integration: features/iot-integration.md
  - Development:
      - Setup Guide: development/setup.md
      - API Documentation: development/api.md
      - Database Migrations: development/migrations.md
      - Testing: development/testing.md
  - Deployment:
      - Production Setup: deployment/production.md
      - Supabase Configuration: deployment/supabase.md
      - Environment Variables: deployment/environment.md
  - Guides:
      - RAG Setup: guides/rag-setup.md
      - User Roles: guides/user-roles.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - Database Schema: reference/database-schema.md
      - API Reference: reference/api.md
      - Configuration Options: reference/configuration.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/project-gmao
